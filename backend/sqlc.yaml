version: "2"
sql:
  - engine: postgresql
    # The runner creates app in immutable migration 0001. The tiny analyzer-only
    # preamble models that existing schema without changing an applied migration.
    schema:
      - internal/corebanking/storage/sqlc_preamble.sql
      - migrations/corebanking/0002_accounts_and_posting.sql
      - migrations/corebanking/0003_accounting_guards.sql
    queries: internal/corebanking/storage/queries.sql
    gen:
      go:
        package: coredb
        out: internal/corebanking/storage/coredb
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/gofrs/uuid/v5
              type: UUID
  - engine: postgresql
    schema:
      - internal/payment/storage/sqlc_preamble.sql
      - migrations/payment/0002_payment_command_model.sql
    queries: internal/payment/storage/queries.sql
    gen:
      go:
        package: paymentdb
        out: internal/payment/storage/paymentdb
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/gofrs/uuid/v5
              type: UUID
