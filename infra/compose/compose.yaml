name: gtb

x-temporal-db: &temporal-db
  DB: postgres12
  DB_PORT: "5432"
  POSTGRES_SEEDS: postgres
  POSTGRES_USER: temporal
  POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?Run make infra-init}

services:
  postgres:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_USER: gtb_admin
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run make infra-init}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Run make infra-init}
      OIDC_DB_PASSWORD: ${OIDC_DB_PASSWORD:?Run make infra-init}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-infrastructure.sql:/docker-entrypoint-initdb.d/10-infrastructure.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U gtb_admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  temporal-schema:
    image: temporalio/admin-tools:1.31.0
    environment:
      <<: *temporal-db
      SQL_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Run make infra-init}
    entrypoint: ["/bin/sh", "/scripts/schema.sh"]
    volumes:
      - ./temporal/schema.sh:/scripts/schema.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  temporal:
    image: temporalio/server:1.31.0
    environment:
      <<: *temporal-db
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamicconfig/local.yaml
    volumes:
      - ./temporal/dynamicconfig.yaml:/etc/temporal/dynamicconfig/local.yaml:ro
    ports:
      - "127.0.0.1:7233:7233"
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    healthcheck:
      # The server image has no CLI. Namespace setup below verifies the health RPC.
      test: [CMD, nc, -z, 127.0.0.1, "7233"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30

  temporal-namespace:
    image: temporalio/admin-tools:1.31.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    entrypoint: ["/bin/sh", "/scripts/namespace.sh"]
    volumes:
      - ./temporal/namespace.sh:/scripts/namespace.sh:ro
    depends_on:
      temporal:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.49.1
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:4.1.2
    environment:
      CLUSTER_ID: Z3RiLWxvY2FsLWthZmthMQ
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, "localhost:19092", --list]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 30

  oidc:
    image: quay.io/keycloak/keycloak:26.7.4
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/oidc
      KC_DB_USERNAME: oidc
      KC_DB_PASSWORD: ${OIDC_DB_PASSWORD:?Run make infra-init}
      KC_BOOTSTRAP_ADMIN_USERNAME: gtb_admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${OIDC_ADMIN_PASSWORD:?Run make infra-init}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8080
      GTB_CUSTOMER_PASSWORD: ${GTB_CUSTOMER_PASSWORD:?Run make infra-init}
      GTB_OPERATIONS_PASSWORD: ${GTB_OPERATIONS_PASSWORD:?Run make infra-init}
      GTB_OPERATIONS_APPROVER_PASSWORD: ${GTB_OPERATIONS_APPROVER_PASSWORD:?Run make infra-init}
      GTB_COMPLIANCE_PASSWORD: ${GTB_COMPLIANCE_PASSWORD:?Run make infra-init}
      GTB_COMPLIANCE_APPROVER_PASSWORD: ${GTB_COMPLIANCE_APPROVER_PASSWORD:?Run make infra-init}
      GTB_AUDITOR_PASSWORD: ${GTB_AUDITOR_PASSWORD:?Run make infra-init}
      GTB_PLATFORM_ADMIN_PASSWORD: ${GTB_PLATFORM_ADMIN_PASSWORD:?Run make infra-init}
      RAIL_SIMULATOR_OIDC_SECRET: ${RAIL_SIMULATOR_OIDC_SECRET:?Run make infra-init}
      SCREENING_SIMULATOR_OIDC_SECRET: ${SCREENING_SIMULATOR_OIDC_SECRET:?Run make infra-init}
      CORE_BANKING_OIDC_SECRET: ${CORE_BANKING_OIDC_SECRET:?Run make infra-init}
      EVENT_PROJECTOR_OIDC_SECRET: ${EVENT_PROJECTOR_OIDC_SECRET:?Run make infra-init}
      EXPIRED_TOKEN_TEST_OIDC_SECRET: ${EXPIRED_TOKEN_TEST_OIDC_SECRET:?Run make infra-init}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./oidc/gtb-realm.json:/opt/keycloak/data/import/gtb-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000"
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 30

volumes:
  postgres-data:
  kafka-data:
